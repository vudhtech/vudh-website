<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Account — VUDH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
<a href="index.html" class="logo">VUDH</a>
<nav>
<a href="signout.html">Sign out</a>
</nav>
</header>

<main class="auth-page">
<section class="auth-card">
<h1>Your VUDH account</h1>
<p id="loading">Loading your account...</p>

<div id="account" hidden>
<p><strong>Username</strong></p>
<p id="username"></p>

<p><strong>Email</strong></p>
<p id="email"></p>

<p><strong>Email verified</strong></p>
<p id="verified"></p>

<a href="signout.html">Sign out</a>
</div>
</section>
</main>

<script>
const API_URL = "https://api.vudh.dev";

async function loadAccount() {
  try {
    const response = await fetch(`${API_URL}/v1/me`, {
      credentials: "include"
    });

    if (!response.ok) {
      window.location.href = "signin.html";
      return;
    }

    const data = await response.json();

    document.getElementById("username").textContent = data.user.username;
    document.getElementById("email").textContent = data.user.email;
    document.getElementById("verified").textContent = data.user.email_verified ? "Yes" : "No";
    document.getElementById("loading").hidden = true;
    document.getElementById("account").hidden = false;
  } catch {
    document.getElementById("loading").textContent = "Unable to connect to VUDH.";
  }
}

loadAccount();
</script>
<script src="auth.js"></script>
</body>
</html>
