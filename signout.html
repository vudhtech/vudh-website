<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign out — VUDH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
<a href="index.html" class="logo">VUDH</a>
</header>

<main class="auth-page">
<section class="auth-card">
<h1>Signing out...</h1>
<p id="message">Please wait.</p>
</section>
</main>

<script>
const API_URL = "https://api.vudh.dev";

async function signOut() {
  try {
    await fetch(`${API_URL}/v1/auth/logout`, {
      method: "POST",
      credentials: "include"
    });
  } finally {
    window.location.href = "index.html";
  }
}

signOut();
</script>
</body>
</html>
